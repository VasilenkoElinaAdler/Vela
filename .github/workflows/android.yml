name: Android test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          if [[ -f "$SDK/platforms/android-36/android.jar" && -x "$SDK/build-tools/35.0.0/aapt2" ]]; then
            echo 'Required Android SDK packages already installed.'
          else
            MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$MANAGER" ]]; then
              MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
            fi
            if [[ -z "$MANAGER" || ! -x "$MANAGER" ]]; then
              echo '::error::Android SDK command-line tools not found'
              exit 1
            fi
            "$MANAGER" --sdk_root="$SDK" 'platforms;android-36' 'build-tools;35.0.0'
          fi
          test -f "$SDK/platforms/android-36/android.jar"
          test -x "$SDK/build-tools/35.0.0/aapt2"
      - name: Validate card data
        run: python3 scripts/validate_cards.py
      - name: Unit tests and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Report APK size
        run: |
          python3 - <<'PY'
          import os, zipfile
          from collections import defaultdict
          apk = 'app/build/outputs/apk/debug/app-debug.apk'
          buckets = defaultdict(int)
          with zipfile.ZipFile(apk) as z:
              for f in z.infolist():
                  n = f.filename
                  k = 'DEX' if n.endswith('.dex') else 'Assets' if n.startswith('assets/') else 'Native libraries' if n.startswith('lib/') else 'Resources' if n.startswith('res/') or n == 'resources.arsc' else 'Other'
                  buckets[k] += f.compress_size
          lines = ['## APK size (debug)', f'Commit: {os.environ.get("GITHUB_SHA","")}', f'APK: {os.path.getsize(apk):,} bytes', 'Compressed ZIP entry sizes:'] + [f'- {k}: {v:,} bytes' for k,v in sorted(buckets.items())]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Automated Android gameplay journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: vela-elina-cards-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
